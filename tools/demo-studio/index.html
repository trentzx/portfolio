<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Demo Studio</title>
    <style>
      html,
      body {
        margin: 0;
        background: #0b0e13;
        color: #cfd8e3;
        font: 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        display: grid;
        place-items: center;
        min-height: 100vh;
      }
      canvas {
        max-width: 96vw;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
      }
      #status {
        margin-top: 12px;
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <canvas id="c" width="1280" height="720"></canvas>
    <div id="status">idle</div>

    <script>
      /*
       * Demo Studio — recreates the Cursorful look for a CLI demo.
       *
       * A terminal session is typed out and its real output printed, inside a
       * rounded window on a blurred brand-coloured backdrop, with zooms that
       * ease in on the moments that matter and back out afterwards. The canvas
       * is captured with MediaRecorder, so the export runs entirely locally.
       *
       * The session itself is data (script.*.json), so the same renderer makes
       * a demo for any project by swapping the file.
       */

      const W = 1280;
      const H = 720;
      const CPS = 0.028; // seconds per typed character
      const LINE_T = 0.055; // seconds per printed output line
      const TITLE_T = 2.6; // title card
      const TAIL_T = 2.0; // hold at the end

      const canvas = document.getElementById('c');
      const ctx = canvas.getContext('2d');
      const status = document.getElementById('status');

      let S = null; // script
      let atoms = []; // timeline of reveal events
      let zooms = []; // {from,to,rect}
      let total = 0;
      let scrollPos = 0; // eased, so new lines slide in rather than snap
      let lastT = 0;

      const ease = t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
      const clamp01 = v => Math.max(0, Math.min(1, v));

      function buildTimeline() {
        atoms = [];
        zooms = [];
        let t = TITLE_T;
        for (const step of S.steps) {
          const prompt = step.prompt || '›';
          atoms.push({ t, kind: 'prompt', text: prompt });
          // Typing, one character at a time.
          for (let i = 0; i < step.cmd.length; i++) {
            atoms.push({ t, kind: 'char', text: step.cmd[i] });
            t += CPS;
          }
          atoms.push({ t, kind: 'commit', prompt });
          t += 0.28;
          let hintAt = null;
          const hints = Array.isArray(step.hint) ? step.hint : step.hint ? [step.hint] : [];
          for (const hl of hints) {
            if (hintAt === null) hintAt = t;
            atoms.push({ t, kind: 'hint', text: hl });
            t += 0.42;
          }
          let firstOutAt = null;
          for (const line of step.out) {
            if (firstOutAt === null) firstOutAt = t;
            atoms.push({ t, kind: step.err ? 'err' : 'out', text: line });
            t += LINE_T;
          }
          t += step.pause || 0.75; // beat between commands

          const anchor = hintAt !== null ? hintAt : firstOutAt;
          if (step.zoom && anchor !== null) {
            /*
             * Push in on the translation itself, not the whole step. Holding a
             * zoom across every command is what made it feel restless; this is
             * a short, deliberate move on the moment polysh recognises a
             * foreign command, then straight back out.
             */
            zooms.push({ from: anchor - 0.15, to: anchor + 1.3 });
          }
        }
        total = t + TAIL_T;
      }

      /** Visible buffer and in-progress typing at time t. */
      function stateAt(t) {
        const lines = [];
        let typing = '';
        let committed = false;
        let prompt = '›';
        for (const a of atoms) {
          if (a.t > t) break;
          if (a.kind === 'prompt') {
            prompt = a.text;
          } else if (a.kind === 'char') {
            typing += a.text;
            committed = false;
          } else if (a.kind === 'commit') {
            lines.push({ kind: 'cmd', text: typing, prompt: a.prompt });
            typing = '';
            committed = true;
          } else {
            lines.push({ kind: a.kind, text: a.text });
          }
        }
        return { lines, typing, committed, prompt };
      }

      // ---------- painting ----------

      /*
       * The wash is drawn tiny and scaled up with smoothing, which is a blur
       * for free. Doing it with ctx.filter = 'blur(70px)' over four
       * full-canvas gradients cost so much that the render loop fell to
       * 13.6fps while recording.
       */
      const BW = 64;
      const BH = 36;
      const bg = document.createElement('canvas');
      bg.width = BW;
      bg.height = BH;
      const bgx = bg.getContext('2d');

      function paintBackdrop(t) {
        bgx.globalCompositeOperation = 'source-over';
        bgx.fillStyle = S.backdrop[0];
        bgx.fillRect(0, 0, BW, BH);
        bgx.globalCompositeOperation = 'lighter';
        S.backdrop.forEach((col, i) => {
          const a = t * 0.12 + i * 1.9;
          const x = BW * (0.5 + 0.42 * Math.cos(a + i));
          const y = BH * (0.5 + 0.46 * Math.sin(a * 0.8 + i * 1.3));
          const g = bgx.createRadialGradient(x, y, 0.5, x, y, BW * 0.5);
          g.addColorStop(0, col);
          g.addColorStop(1, 'rgba(0,0,0,0)');
          bgx.fillStyle = g;
          bgx.fillRect(0, 0, BW, BH);
        });
        bgx.globalCompositeOperation = 'source-over';

        ctx.save();
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(bg, 0, 0, W, H);
        ctx.restore();
      }

      function roundRect(c, x, y, w, h, r) {
        c.beginPath();
        c.moveTo(x + r, y);
        c.arcTo(x + w, y, x + w, y + h, r);
        c.arcTo(x + w, y + h, x, y + h, r);
        c.arcTo(x, y + h, x, y, r);
        c.arcTo(x, y, x + w, y, r);
        c.closePath();
      }

      /*
       * Window chrome is identical every frame, and its drop shadow is one of
       * the most expensive things on the canvas, so it is rendered once and
       * blitted. Only the session text is drawn per frame.
       */
      const WIN = { x: 142, y: 64, w: W - 284, h: H - 136, r: 14 };
      let chrome = null;

      function buildChrome() {
        chrome = document.createElement('canvas');
        chrome.width = W;
        chrome.height = H;
        const c = chrome.getContext('2d');
        const { x, y, w, h, r } = WIN;

        c.save();
        c.shadowColor = 'rgba(0,0,0,0.5)';
        c.shadowBlur = 48;
        c.shadowOffsetY = 20;
        roundRect(c, x, y, w, h, r);
        c.fillStyle = '#0f1419';
        c.fill();
        c.restore();

        c.save();
        roundRect(c, x, y, w, h, r);
        c.clip();
        c.fillStyle = '#161c23';
        c.fillRect(x, y, w, 36);
        ['#ff5f57', '#febc2e', '#28c840'].forEach((col, i) => {
          c.fillStyle = col;
          c.beginPath();
          c.arc(x + 20 + i * 18, y + 18, 5.5, 0, Math.PI * 2);
          c.fill();
        });
        c.fillStyle = 'rgba(207,216,227,0.55)';
        c.font = '12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';
        c.textAlign = 'center';
        c.fillText(`${S.title} — ${S.cwd}`, x + w / 2, y + 22);
        c.restore();
      }

      function paintWindow(t) {
        const { x, y, w, h, r } = WIN;
        if (!chrome) buildChrome();
        ctx.drawImage(chrome, 0, 0);

        ctx.save();
        roundRect(ctx, x, y, w, h, r);
        ctx.clip();

        const { lines, typing, committed, prompt } = stateAt(t);
        const FS = 15;
        const LH = 23;
        ctx.font = `${FS}px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace`;
        ctx.textAlign = 'left';
        const bodyTop = y + 36 + 18;
        const bodyH = h - 36 - 28;
        const maxLines = Math.floor(bodyH / LH);

        const render = lines.slice();
        if (typing || !committed) render.push({ kind: 'typing', text: typing, prompt });

        // Ease the scroll so the buffer glides; snapping a whole line at a
        // time is a big part of what read as low frame rate.
        const target = Math.max(0, render.length - maxLines);
        const dt = Math.max(0, Math.min(0.1, t - lastT));
        lastT = t;
        scrollPos += (target - scrollPos) * Math.min(1, dt * 10);
        if (Math.abs(target - scrollPos) < 0.01) scrollPos = target;

        const first = Math.floor(scrollPos);
        const frac = scrollPos - first;
        const shown = render.slice(first, first + maxLines + 1);

        shown.forEach((ln, i) => {
          const ty = bodyTop + (i - frac) * LH;
          if (ty < bodyTop - LH || ty > bodyTop + bodyH) return;
          let tx = x + 22;
          if (ln.kind === 'cmd' || ln.kind === 'typing') {
            const pr = ln.prompt || '›';
            // PowerShell's own prompt stays neutral; polysh's is its accent.
            ctx.fillStyle = pr === '›' ? S.accent2 : 'rgba(150,170,190,0.9)';
            ctx.fillText(pr, tx, ty);
            tx += ctx.measureText(pr).width + 9;
            ctx.fillStyle = '#e8eef5';
            ctx.fillText(ln.text, tx, ty);
            if (ln.kind === 'typing' && Math.floor(t * 2) % 2 === 0) {
              const cw = ctx.measureText(ln.text).width;
              ctx.fillStyle = S.accent;
              ctx.fillRect(tx + cw + 2, ty - FS + 3, 8, FS);
            }
          } else if (ln.kind === 'hint') {
            ctx.fillStyle = S.accent;
            ctx.fillText('  ' + ln.text, tx, ty);
          } else if (ln.kind === 'err') {
            ctx.fillStyle = '#ff6b5e';
            ctx.fillText(ln.text, tx, ty);
          } else {
            ctx.fillStyle = 'rgba(190,203,217,0.85)';
            ctx.fillText(ln.text, tx, ty);
          }
        });

        ctx.restore();
        return WIN;
      }

      function paintTitle(t) {
        // Fades out as the terminal takes over.
        const a = t < TITLE_T - 0.6 ? 1 : clamp01((TITLE_T - t) / 0.6);
        if (a <= 0) return;
        ctx.save();
        ctx.globalAlpha = a;
        ctx.fillStyle = 'rgba(6,9,14,0.55)';
        ctx.fillRect(0, 0, W, H);
        ctx.textAlign = 'center';
        ctx.fillStyle = '#f3f7fb';
        ctx.font = '600 68px ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif';
        ctx.fillText(S.title, W / 2, H / 2 - 18);
        ctx.fillStyle = S.accent;
        ctx.fillRect(W / 2 - 54, H / 2 + 6, 108, 4);
        ctx.fillStyle = 'rgba(214,226,238,0.92)';
        ctx.font = '400 24px ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif';
        ctx.fillText(S.tagline, W / 2, H / 2 + 52);
        ctx.fillStyle = 'rgba(176,192,208,0.75)';
        ctx.font = '400 17px ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif';
        ctx.fillText(S.subtitle, W / 2, H / 2 + 84);
        ctx.restore();
      }

      /** Zoom factor and focus for time t, eased in and out. */
      function cameraAt(t) {
        let z = 0;
        for (const s of zooms) {
          const inT = 0.7;
          const outT = 0.8;
          if (t < s.from - inT || t > s.to + outT) continue;
          if (t < s.from) z = Math.max(z, ease(clamp01((t - (s.from - inT)) / inT)));
          else if (t <= s.to) z = 1;
          else z = Math.max(z, 1 - ease(clamp01((t - s.to) / outT)));
        }
        return z;
      }

      function frame(t) {
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        paintBackdrop(t);

        const z = cameraAt(t);
        /*
         * Modest push, centred on the text column. A deeper zoom off a
         * left-of-centre focus threw the start of every line outside the
         * frame, which reads as broken rather than cinematic.
         */
        const scale = 1 + 0.17 * z;
        const fx = W * 0.5;
        const fy = H * 0.52;
        ctx.save();
        ctx.translate(fx, fy);
        ctx.scale(scale, scale);
        ctx.translate(-fx, -fy);
        paintWindow(t);
        ctx.restore();

        paintTitle(t);
      }

      // ---------- record ----------

      async function run() {
        const res = await fetch('script.polysh.json');
        S = await res.json();
        buildTimeline();

        /*
         * captureStream(fps) leaves frame production to the compositor, which
         * under-delivers badly when the page is not on a real display: the
         * first export measured 9.4fps out of a 61fps render. captureStream(0)
         * plus an explicit requestFrame() after every draw pins exactly one
         * encoded frame per painted frame.
         */
        const stream = canvas.captureStream(0);
        const track = stream.getVideoTracks()[0];
        const mime = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'].find(m =>
          MediaRecorder.isTypeSupported(m),
        );
        const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: S.bitrate || 12_000_000 });
        const chunks = [];
        rec.ondataavailable = e => e.data.size && chunks.push(e.data);

        const done = new Promise(resolve => {
          rec.onstop = () => {
            const blob = new Blob(chunks, { type: mime });
            const fr = new FileReader();
            fr.onload = () => {
              window.__dataUrl = fr.result;
              window.__done = true;
              status.textContent = `done — ${(blob.size / 1e6).toFixed(2)} MB, ${total.toFixed(1)}s`;
              resolve();
            };
            fr.readAsDataURL(blob);
          };
        });

        rec.start();
        const t0 = performance.now();
        let painted = 0;
        await new Promise(resolve => {
          const tick = () => {
            const t = (performance.now() - t0) / 1000;
            frame(Math.min(t, total));
            track.requestFrame();
            painted++;
            status.textContent = `recording ${t.toFixed(1)} / ${total.toFixed(1)}s`;
            if (t < total) requestAnimationFrame(tick);
            else resolve();
          };
          requestAnimationFrame(tick);
        });
        window.__paintedFps = +(painted / ((performance.now() - t0) / 1000)).toFixed(1);
        rec.stop();
        await done;
      }

      window.__done = false;
      window.__start = () => {
        window.__done = false;
        scrollPos = 0;
        lastT = 0;
        chrome = null;
        run();
        return 'started';
      };
      // Draw a first frame so the canvas isn't blank before recording.
      fetch('script.polysh.json')
        .then(r => r.json())
        .then(j => {
          S = j;
          buildTimeline();
          frame(0);
        });
    </script>
  </body>
</html>
